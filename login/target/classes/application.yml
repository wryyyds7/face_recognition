spring:

  datasource:
    url: jdbc:mysql://localhost:3306/login?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
  security:
    enabled: false
  application:
    name: login
  main:
    web-application-type: servlet
    allow-bean-definition-overriding: true

  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        # 增加连接超时时间
        timeout: 10000
        # 设置注册延迟时间
        register-delay-time: 5000
        # 失败后允许重试
        fail-fast: false
        # 重试配置
        retry-times: 3
        retry-delay: 2000

logging:
  level:
    org.springframework.security: TRACE
server:
  port: 0