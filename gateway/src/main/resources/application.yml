spring:
  datasource:
    url: jdbc:mysql://localhost:3306/face_recognition?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  config:
    import: nacos:application.yml,file:${user.dir}/config/config.yml
  security:
    enabled: false
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: users
          uri:  lb://users  # lb表示负载均衡
          predicates:
            - Path=/users/**
#          filters:
#            - auth
        - id: login
          uri:  lb://login
          predicates:
            - Path=/in/**
#          filters:
#            - auth
        - id: voice-synthesis
          uri:  lb://voice-synthesis
          predicates:
            - Path=/voice/**
#          filters:
#            - auth
        - id: recognition
          uri:  lb://recognition
          predicates:
            - Path=/recognition/**
