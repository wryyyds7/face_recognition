server:
  port: 0

spring:
  application:
    name: recognition
  config:
    import: optional:nacos
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/face?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  servlet:
    multipart:
      # 从共享配置文件读取：config/config.yml -> upload.max-file-size
      max-file-size: 10MB
      # 从共享配置文件读取：config/config.yml -> upload.max-request-size
      max-request-size: 10MB
  main:
    allow-bean-definition-overriding: true

# Python服务配置
python:
  port:
    # 从共享配置文件读取：config/config.yml -> python.url
    url: http://localhost:5000
    # 人脸数据库路径 - 从共享配置文件读取：config/config.yml -> database.root-path
    db-path: d:/bianchenglianxi/java/project/face_recognition/python_port/img
    # 临时文件路径 - 从共享配置文件读取：config/config.yml -> database.temp-path
    temp-path: d:/bianchenglianxi/java/project/face_recognition/python_port/uploads
    # 清理间隔（毫秒） - 从共享配置文件读取：config/config.yml -> detection.cleanup-interval - 24小时
    cleanup-interval: 86400000

# 人脸检测配置
face:
  detection:
    # 检测间隔（毫秒） - 从共享配置文件读取：config/config.yml -> detection.interval
    interval: 5000
    photo-path: d:/bianchenglianxi/java/project/face_recognition/python_port/uploads
    success-photo-path: d:/bianchenglianxi/java/project/face_recognition/python_port/uploads/photos/success
    fail-photo-path: d:/bianchenglianxi/java/project/face_recognition/python_port/uploads/photos/fail

# 日志配置
logging:
  level:
    com.example.recognition: info
    com.example.common.feign: debug



# Swagger配置
swagger:
  base-package: com.homework.recognition.controller
  title: 人脸识别服务API
  description: 人脸识别服务接口文档
  version: 1.0.0
