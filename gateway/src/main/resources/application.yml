hm:
  auth:
    excludePaths:
      - /in/**
      - /users/**
      - /search/**
      - /system/**
      - /recognition/detect

# 使用config.yml中的端口配置
server:
  port: ${gateway.port:8089}
  allowedUrl: ${gateway.host}
logging:
  level:
    org.springframework.security: TRACE
